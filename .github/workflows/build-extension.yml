name: Build FreeMusic extension only

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instruction-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out extension source
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Select Python for independent ARM64 emulation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble, disassemble and execute ARM64 predicate fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet setuptools==80.9.0 capstone==5.0.6 unicorn==2.1.4 keystone-engine==0.9.2
          python test_player_swipe_patch.py -v
          python test_playback_cache_patch.py -v
          python test_adaptive_playback_patch.py -v
          python test_native_format_patch.py -v

  build:
    needs: instruction-tests
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out extension source
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Verify no IPA was committed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git ls-files '*.ipa' '*.IPA')" ]]; then
            echo 'FAILED: this repository must contain extension source only, without user IPA files.' >&2
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Test JavaScript bootstrap contracts
        shell: bash
        run: node test_lx_bootstrap.cjs

      - name: Test JavaScript runtime on macOS
        shell: bash
        run: bash test_lx_runtime_macos.sh

      - name: Test highest-first quality fallback and cancellation
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -fblocks -framework Foundation \
            FMQualityResolver.m FMQualityResolverTests.m -o quality-resolver-tests
          ./quality-resolver-tests
          xcrun clang -fobjc-arc -fblocks -framework Foundation \
            -framework JavaScriptCore -framework Security \
            LXSourceRuntime.m FMQualityResolver.m LXQualityRuntimeTests.m -o quality-runtime-tests
          ./quality-runtime-tests LXBootstrap.js

      - name: Test request interception on macOS
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -fblocks -framework Foundation \
            FMExtensionProtocol.m FMQishuiSearch.m FMLXMC.m FMTrackMetadata.m FMExtensionProtocolTests.m -lz -o protocol-tests
          ./protocol-tests intercept-contract-fixtures.json

      - name: Test LX song metadata compatibility and credential isolation
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -framework Foundation \
            FMTrackMetadata.m FMTrackMetadataTests.m -o track-metadata-tests
          ./track-metadata-tests

      - name: Test real JS download retries and audio file validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v7-validation
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror=implicit-function-declaration \
            -framework Foundation -framework AVFoundation -framework AudioToolbox -framework CoreMedia \
            FMQualityResolver.m FMJSDownloadCoordinator.m FMJSDownloadTests.m -o download-coordinator-tests
          ./download-coordinator-tests v7-validation/download-coordinator-tests.json

      - name: Test native download queue integration with real transfers
        if: ${{ !cancelled() }}
        shell: bash
        run: bash test_native_download_macos.sh "$PWD/v7-validation/native-download-tests.json"

      - name: Test actual download formats and transactional file preservation
        if: ${{ !cancelled() }}
        shell: bash
        run: bash test_native_download_format_macos.sh "$PWD/v7-validation/download-format-tests.json"

      - name: Test Qishui search and cursor pagination
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -fblocks -framework Foundation \
            FMQishuiSearch.m FMQishuiSearchTests.m -o qishui-search-tests
          ./qishui-search-tests

      - name: Test global Home search preferences
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -fblocks -framework Foundation \
            FMSettingsMigration.m FMSearchPreferences.m FMSearchPreferencesTests.m -o search-preference-tests
          ./search-preference-tests

      - name: Test settings upgrade preservation and interrupted-write recovery
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v8-validation
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -framework Foundation \
            FMSettingsMigration.m FMSettingsMigrationTests.m -o settings-migration-tests
          ./settings-migration-tests v8-validation/settings-migration-tests.json

      - name: Test monthly and annual listening statistics
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -fblocks -framework Foundation \
            FMListeningHistory.m FMListeningHistoryTests.m -o insights-tests
          ./insights-tests

      - name: Test LXMC playlists and single-use local import bridge
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -fblocks -framework Foundation \
            FMLXMC.m FMLXMCTests.m -lz -o lxmc-tests
          ./lxmc-tests

      - name: Test Mach-O packaging structure without a user IPA
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 test_package_extension.py -v
          python3 test_signing_identity.py
          python3 test_verify_interaction_result.py

      - name: Compile iOS device extension
        if: ${{ success() }}
        shell: bash
        run: bash build_extension.sh . dist

      - name: Test extension UI and artwork on iPhone Simulator
        if: ${{ success() }}
        shell: bash
        run: bash test_ios_smoke.sh . smoke-artifact

      - name: Record JS and download validation provenance
        if: always()
        shell: bash
        run: python3 record_v7_validation.py v7-validation smoke-artifact

      - name: Record v8 validation provenance
        if: always()
        shell: bash
        run: python3 record_v8_validation.py v8-validation smoke-artifact

      - name: Upload simulator validation evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: FMExtension-simulator-validation
          path: smoke-artifact/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload extension artifacts only
        uses: actions/upload-artifact@v4.6.2
        with:
          name: FMExtension-arm64
          path: |
            dist/FMExtension.dylib
            dist/LXBootstrap.js
            dist/build-manifest.json
          if-no-files-found: error
          retention-days: 7

# Copy this file to .github/workflows/build-extension.yml in the build repository.
# Keep production/test sources and the build/packaging Python tools at repo root.
# The downloaded dylib is injected into the original IPA locally, never here.
